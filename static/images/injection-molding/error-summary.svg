<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="800" height="460" fill="#fbfbfd"/>
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2b4a">材料手册典型错误一览</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#6b7a90">对照原文 → 问题 → 修正</text>

  <!-- 表头 -->
  <rect x="40" y="85" width="240" height="44" fill="#3b6fe0"/>
  <rect x="280" y="85" width="220" height="44" fill="#5b7cd6"/>
  <rect x="500" y="85" width="260" height="44" fill="#e0773b"/>
  <text x="160" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">原文表述</text>
  <text x="390" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">问题</text>
  <text x="630" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">修正</text>

  <!-- 行1 ABS -->
  <rect x="40" y="129" width="240" height="66" fill="#fff" stroke="#e3e9f2"/>
  <rect x="280" y="129" width="220" height="66" fill="#fff" stroke="#e3e9f2"/>
  <rect x="500" y="129" width="260" height="66" fill="#fff" stroke="#e3e9f2"/>
  <text x="160" y="157" text-anchor="middle" font-size="13" fill="#33455e">ABS 缺点「拉伸率底」</text>
  <text x="390" y="157" text-anchor="middle" font-size="13" fill="#c0392b">错别字</text>
  <text x="630" y="157" text-anchor="middle" font-size="13" fill="#2fa46a">「拉伸率低」</text>
  <text x="160" y="182" text-anchor="middle" font-size="11" fill="#8a97a8">（拉伸/断裂伸长率低）</text>

  <!-- 行2 PE -->
  <rect x="40" y="195" width="240" height="66" fill="#fff" stroke="#e3e9f2"/>
  <rect x="280" y="195" width="220" height="66" fill="#fff" stroke="#e3e9f2"/>
  <rect x="500" y="195" width="260" height="66" fill="#fff" stroke="#e3e9f2"/>
  <text x="160" y="223" text-anchor="middle" font-size="13" fill="#33455e">PE 缺点「不易押出」</text>
  <text x="390" y="223" text-anchor="middle" font-size="13" fill="#c0392b">方向性错误</text>
  <text x="630" y="223" text-anchor="middle" font-size="13" fill="#2fa46a">PE 极易挤出成型</text>
  <text x="160" y="248" text-anchor="middle" font-size="11" fill="#8a97a8">（且编号缺「3」）</text>

  <!-- 行3 PVC -->
  <rect x="40" y="261" width="240" height="66" fill="#fff" stroke="#e3e9f2"/>
  <rect x="280" y="261" width="220" height="66" fill="#fff" stroke="#e3e9f2"/>
  <rect x="500" y="261" width="260" height="66" fill="#fff" stroke="#e3e9f2"/>
  <text x="160" y="289" text-anchor="middle" font-size="13" fill="#33455e">PVC 缺点「耐化性差」</text>
  <text x="390" y="289" text-anchor="middle" font-size="13" fill="#c0392b">方向性错误</text>
  <text x="630" y="289" text-anchor="middle" font-size="13" fill="#2fa46a">「耐热性差」</text>
  <text x="160" y="314" text-anchor="middle" font-size="11" fill="#8a97a8">（PVC 耐酸碱，耐化学性其实好）</text>

  <!-- 行4 PA66 -->
  <rect x="40" y="327" width="240" height="66" fill="#fff" stroke="#e3e9f2"/>
  <rect x="280" y="327" width="220" height="66" fill="#fff" stroke="#e3e9f2"/>
  <rect x="500" y="327" width="260" height="66" fill="#fff" stroke="#e3e9f2"/>
  <text x="160" y="355" text-anchor="middle" font-size="13" fill="#33455e">PA66 优点「自熄性」</text>
  <text x="390" y="355" text-anchor="middle" font-size="13" fill="#e67e22">表述不准确</text>
  <text x="630" y="355" text-anchor="middle" font-size="13" fill="#2fa46a">「具一定阻燃性」</text>
  <text x="160" y="380" text-anchor="middle" font-size="11" fill="#8a97a8">（自熄通常指 PC/PVC/PPS）</text>

  <!-- 行5 POM -->
  <rect x="40" y="393" width="240" height="52" fill="#fff" stroke="#e3e9f2"/>
  <rect x="280" y="393" width="220" height="52" fill="#fff" stroke="#e3e9f2"/>
  <rect x="500" y="393" width="260" height="52" fill="#fff" stroke="#e3e9f2"/>
  <text x="160" y="416" text-anchor="middle" font-size="13" fill="#33455e">POM 收缩率「1.8-2.6%」</text>
  <text x="390" y="416" text-anchor="middle" font-size="13" fill="#e67e22">区间可接受</text>
  <text x="630" y="416" text-anchor="middle" font-size="13" fill="#2fa46a">按壁厚/浇口修正，典型 2%</text>
  <text x="160" y="437" text-anchor="middle" font-size="11" fill="#8a97a8">（行业常用 1.5%~2.5%）</text>
</svg>
